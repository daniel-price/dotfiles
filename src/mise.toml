# Reviewed Base bootstrap manifest, selected temporarily to preserve
# per-operation consent. Normal shells instead load home/.config/mise/config.toml through
# ~/.config/mise/config.toml. Optional modules are selected via miserc.local.toml.
# Shared tool versions are declared only in src/home/.config/mise/base-tools.toml.
include = ["./home/.config/mise/base-tools.toml"]

# The Ghostty package for Pop!_OS 24.04 comes from a community PPA.
# Bootstrap previews the full package plan and asks for approval before any
# package or APT source is installed.
[bootstrap.apt.sources]
ghostty = { ppa = "mkasberg/ghostty-ubuntu" }

[bootstrap.packages]
"apt:zsh" = { os = "linux" }
"apt:wl-clipboard" = { os = "linux" }
"brew:zsh" = { os = "macos" }
"apt:ghostty" = { os = "linux" }
"brew-cask:ghostty" = { os = "macos" }

[dotfiles]
# Bootstrap the normal mise global config without a second copy of Base.
# Keep the module file beside it so mise's env selection discovers it. These
# targets are never force-overwritten; an existing user config is a conflict.
"~/.config/mise/config.toml" = { source = "home/.config/mise/config.toml", mode = "symlink" }
"~/.config/mise/base-tools.toml" = { source = "home/.config/mise/base-tools.toml", mode = "symlink" }
"~/.config/mise/config.opencode.toml" = { source = "modules/opencode/config.opencode.toml", mode = "symlink" }
"~/.zshrc" = { source = "home/.zshrc", mode = "symlink" }
"~/.config/git/config" = { source = "home/.config/git/config", mode = "symlink" }
"~/.config/atuin/config.toml" = { source = "home/.config/atuin/config.toml", mode = "symlink" }
"~/.config/stylua.toml" = { source = "home/.config/stylua.toml", mode = "symlink" }
"~/.config/zellij/config.kdl" = { source = "home/.config/zellij/config.kdl", mode = "symlink" }
"~/.config/ghostty/config" = { source = "home/.config/ghostty/config", mode = "symlink" }

[settings]
auto_install = false
