# Reviewed, public machine setup. Not installed as the global config automatically.
# Bootstrap selects this explicitly and never loads checkout developer tools.
[tools]
neovim = "0.12.6"
zellij = "0.46.0"

[bootstrap.packages]
"apt:zsh" = { os = "linux" }
"brew:zsh" = { os = "macos" }

[dotfiles]
"~/.zshrc" = { source = "../zsh/zshrc", mode = "symlink" }

[settings]
auto_install = false
