# Reviewed machine-only manifest. Not discovered when maintaining this checkout.
# Setup selects it via MISE_GLOBAL_CONFIG_FILE and runs mise from /.
# Machine tool entries must be exact numeric versions; bootstrap and cleanup
# enumerate them automatically and require individual consent.
[tools]
neovim = "0.12.6"
zellij = "0.46.0"
zoxide = "0.10.0"
ripgrep = "15.2.0"
fd = "10.5.2"
gh = "2.105.0"
argc = "1.24.0"

# The Ghostty package for Pop!_OS 24.04 comes from a community PPA.
# Bootstrap previews the full package plan and asks for approval before any
# package or APT source is installed.
[bootstrap.apt.sources]
ghostty = { ppa = "mkasberg/ghostty-ubuntu" }

[bootstrap.packages]
"apt:zsh" = { os = "linux" }
"brew:zsh" = { os = "macos" }
"apt:ghostty" = { os = "linux" }
"brew-cask:ghostty" = { os = "macos" }

[dotfiles]
"~/.zshrc" = { source = "../../.config/zsh/zshrc", mode = "symlink" }
"~/.config/git/config" = { source = "../../.config/git/config", mode = "symlink" }
"~/.config/atuin/config.toml" = { source = "../../.config/atuin/config.toml", mode = "symlink" }
"~/.config/stylua.toml" = { source = "../../.config/stylua.toml", mode = "symlink" }
"~/.config/zellij/config.kdl" = { source = "../../.config/zellij/config.kdl", mode = "symlink" }
"~/.config/ghostty/config" = { source = "../../.config/ghostty/config", mode = "symlink" }

[settings]
auto_install = false
