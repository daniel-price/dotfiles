# Development tools for this checkout; separate from the managed global config.
[tools]
lefthook = "2.2.2"
shfmt = "3.14.1"
shellcheck = "0.11.0"

[settings]
# Installing or changing tool versions is an explicit developer action.
auto_install = false

[tasks."hooks:install"]
description = "Enable this checkout's pre-commit hook after confirmation"
run = "bash scripts/dev/install-hooks.sh"

[tasks.check]
description = "Check tracked shell scripts without changing files or staging"
run = """
result=0
bash scripts/dev/format.sh --check || result=$?
bash scripts/dev/lint.sh || result=$?
exit "$result"
"""

[tasks.format]
description = "Format tracked shell scripts without staging changes"
run = "bash scripts/dev/format.sh"

[tasks.lint]
description = "Lint tracked shell scripts without changing files or staging"
run = "bash scripts/dev/lint.sh"

[tasks."test:hooks"]
description = "Test auto-formatting and partial staging in a disposable repository"
run = "bash tests/hooks.sh"
