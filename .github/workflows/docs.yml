name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate documentation
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.preview.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Zensical
        run: bash scripts/dev/install-docs-deps.sh
      - name: Validate bootstrap scripts
        run: bash tests/run.sh
      - name: Build and validate site
        run: bash scripts/dev/build-docs.sh
      - name: Upload PR documentation preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  comment:
    name: Link PR preview artifact
    needs: build
    # Never execute PR checkout contents with a write-scoped token.
    # Fork PRs still get an artifact, but cannot post a comment here.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.build.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- dotfiles-documentation-preview -->';
            const url = process.env.PREVIEW_URL;
            if (!url) throw new Error('No documentation preview artifact URL');
            const body = `${marker}
            📖 **Documentation preview:** [Download the built site (ZIP)](${url})

            To inspect locally, extract the ZIP into a folder called \`dotfiles\`, run
            \`python3 -m http.server 8000\` from its parent directory, then open
            [http://localhost:8000/dotfiles/](http://localhost:8000/dotfiles/).

            This is a downloadable artifact, not a hosted preview. The link expires
            after 14 days (and may require GitHub sign-in).
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
