name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate documentation
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.preview.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
        with:
          version: "2026.11.9"
          install: false
      - name: Install argc for generated command reference
        run: bash dev/scripts/install-dev-tools.sh
      - name: Install Zensical
        run: bash dev/scripts/install-docs-deps.sh
      - name: Validate bootstrap scripts
        run: bash dev/scripts/run-mise.sh exec -- bash dev/tests/run.sh
      - name: Build and validate site
        run: bash dev/scripts/build-docs.sh
      - name: Upload PR documentation preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
