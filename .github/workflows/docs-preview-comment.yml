name: Documentation preview comment

# Runs from the trusted default branch after the unprivileged PR build.
# Never check out or execute code from the pull request in this workflow.
on:
  workflow_run:
    workflows: [Documentation]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: read

jobs:
  comment:
    name: Link PR documentation artifact
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != ''
    runs-on: ubuntu-latest
    steps:
      - name: Create or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // workflow_run.pull_requests can be empty for otherwise valid PR
            // builds. Resolve the open same-repo PR by its exact head branch.
            const matches = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open',
              head: `${owner}:${run.head_branch}`, per_page: 100
            });
            const pr = matches.find(item =>
              item.head.repo.full_name === run.head_repository.full_name &&
              item.head.ref === run.head_branch
            );
            if (!pr) {
              core.info('No open same-repository PR for this build branch.');
              return;
            }
            const issue_number = pr.number;

            // The PR may have advanced while an older build was finishing.
            // PR workflow_run.head_sha can be a synthetic merge commit, so
            // compare against the source branch SHA when provided.
            const eventPr = run.pull_requests?.find(item => item.number === issue_number);
            if (eventPr?.head?.sha && eventPr.head.sha !== pr.head.sha) {
              core.info('Skipping an outdated PR build.');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 }
            );
            const artifact = artifacts.find(item =>
              item.name === 'documentation-preview' && !item.expired
            );
            if (!artifact) {
              core.warning('Successful PR build has no documentation-preview artifact.');
              return;
            }

            const marker = '<!-- dotfiles-documentation-preview -->';
            const url = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
            const body = [
              marker,
              `📖 **Documentation preview:** [Download the built site (ZIP)](${url})`,
              '',
              'Extract the ZIP into a directory named `dotfiles`. From its parent',
              'directory run `python3 -m http.server 8000`, then visit',
              '[http://localhost:8000/dotfiles/](http://localhost:8000/dotfiles/).',
              '',
              'This is a downloadable artifact, not a hosted preview.',
              'It expires after 14 days and may require GitHub sign-in.'
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const previous = comments.find(item =>
              item.user.type === 'Bot' && item.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
