name: Shell checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
        with:
          version: "2026.11.9"
          install: false
      - name: Install development tools
        run: bash scripts/dev/install-dev-tools.sh
      - name: Check formatting
        run: bash scripts/dev/format.sh --check
      - name: Lint shell scripts
        run: bash scripts/dev/lint.sh
      - name: Test CLI and integration behaviour
        run: bash scripts/dev/test.sh
      - name: Check validation left tracked files unchanged
        run: bash scripts/dev/check-clean.sh
