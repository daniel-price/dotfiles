name: POC - Usage inline CLI

on:
  pull_request:
    paths:
      - "poc/cli-usage/**"
      - ".github/workflows/poc-cli-usage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5
        with:
          version: "2026.11.9"
          install: false
      - name: Verify inline Usage CLI
        run: bash poc/cli-usage/check.sh --install
